name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (face_db, unlock state machine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          cmake -S test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files 'components/*.c' 'components/*.h' 'components/*.cpp' \
                       'main/*.c' 'test/host/*.c' 'test/target/main/*.c' \
            | xargs clang-format --dry-run --Werror

  firmware:
    name: Firmware build (ESP-IDF v5.5.1, esp32s3)
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py size
      # An empty SSID lets the compiler drop all Wi-Fi and stream code, so
      # build once with a dummy SSID to prove that code links and fits.
      - name: Build app with Wi-Fi on
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          echo 'CONFIG_NET_COMM_WIFI_SSID="ci"' > /tmp/wifi.defaults
          idf.py -B build-wifi -D SDKCONFIG=build-wifi/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;/tmp/wifi.defaults" \
            build
      - name: Build on-device test app
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd test/target
          idf.py build
      - name: Keep firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            dependencies.lock

  mobile-app:
    name: Phone app (flutter analyze + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  pc-tool:
    name: PC bench tool (parsers, services, frontend, Tauri check)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pc_tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc_tool
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc_tool/package-lock.json
      # The two pure crates need no system libraries.
      - run: cargo fmt --all --check
      - run: cargo test -p board_protocol -p bench_core
      - run: cargo clippy -p board_protocol -p bench_core --all-targets -- -D warnings
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The Tauri crate links WebKitGTK.
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libudev-dev patchelf
      - run: cargo check -p pc_tool

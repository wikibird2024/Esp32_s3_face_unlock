[workspace]
resolver = "2"
members = ["crates/board_protocol", "crates/bench_core", "src-tauri"]

[workspace.package]
edition = "2021"
authors = ["Hao Tran"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
